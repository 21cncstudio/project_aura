[platformio]
default_envs = project_aura

[env:project_aura]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
custom_hardware_profile = 4_3
custom_hardware_target = aura-aq-v1
custom_build_id_suffix =
custom_gt911_address = 0x14
custom_gt911_startup_diagnostics = false

; --- MEMORY (Flash) ---
; Flash: 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB_littlefs.csv
board_build.filesystem = littlefs


board_build.arduino.memory_type = qio_opi
board_build.sdkconfig = sdkconfig.defaults

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Both hardware profiles use native USB for flashing and Serial logging.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Arduino-ESP32 3.1.1 leaves NetworkEvents callback storage unlocked by default.
    -DNETWORK_EVENTS_MUTEX
    ; Backport Espressif f99c3c6 for the ESP-IDF 5.3.2 esp_restart cache race.
    -Wl,--wrap=esp_restart_noos
    ; Count the exact ESP-IDF 5.3.2 RGB ISR recovery path without a per-frame hook.
    -Wl,--wrap=esp_lcd_rgb_panel_register_event_callbacks
    -Wl,--wrap=gdma_start
    ; Retain the fixed-offset OTA hardware-model descriptor inside the ESP BIN.
    -Wl,-u,aura_ota_image_identity
    -DAPP_VERSION=\"1.1.6-beta\"
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0
    -I include

build_src_filter =
    +<*>
    -<ui/ui.c>
    -<web/WebTransportArduino.cpp>

extra_scripts =
    pre:scripts/postprocess_eez_ui.py
    pre:scripts/check_sensor_i2c_routing.py
    pre:scripts/set_build_id.py
    pre:scripts/generate_dashboard_gzip.py
    pre:scripts/generate_dac_gzip.py
    pre:scripts/generate_theme_gzip.py
    post:scripts/check_rtc_noinit_abi.py
    post:scripts/check_esp_restart_noos.py
    pre:scripts/check_rgb_dma_diagnostics.py
    post:scripts/check_ota_image_identity.py

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    ESP32_IO_Expander=symlink://third_party/ESP32_IO_Expander_Aura
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bblanchon/ArduinoJson@^7.0.0

[env:project_aura_7]
extends = env:project_aura
custom_hardware_profile = 7_dual_i2c_scl6
custom_hardware_target = aura-aq-7-v1
custom_build_id_suffix = 7-dual-i2c-scl6
custom_gt911_address = 0x5D

; Same production address with bounded startup identity/config/opposite reads.
[env:project_aura_7_gt911_5d]
extends = env:project_aura_7
custom_gt911_startup_diagnostics = true

